[project]
name = "decisionguru-backend"
version = "0.1.0"
description = "Swiss tax-aware investment counterfactual analyzer — FastAPI backend (yfinance + pandas + PySpark)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "yfinance>=0.2.51",
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas-ta-classic>=0.4",
    "cachetools>=5.5",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "python-docx>=1.1",
    "pyspark>=3.5",
    "pypdf>=5.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
